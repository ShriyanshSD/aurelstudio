[build]
command = "npm run build"
publish = "dist"
functions = "netlify/functions"

[build.environment]
NODE_VERSION = "22"
# The storefront WhatsApp number and UPI payee name are public details shown to
# every customer at checkout (the payee name is the brand name, which appears
# throughout the codebase), so they must not be treated as secrets by scanning.
SECRETS_SCAN_OMIT_KEYS = "AUREL_WHATSAPP_NUMBER,AUREL_UPI_PAYEE_NAME"

[functions]
node_bundler = "esbuild"

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/:splat"
status = 200
force = true

[[redirects]]
from = "/admin"
to = "/index.html"
status = 200

[[redirects]]
from = "/admin/*"
to = "/index.html"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/*"
[headers.values]
Content-Security-Policy = "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'report-sample'; require-trusted-types-for 'script'; trusted-types 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://*.supabase.co; frame-src 'self'; upgrade-insecure-requests"
Cross-Origin-Opener-Policy = "same-origin-allow-popups"
Strict-Transport-Security = "max-age=300"
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
X-XSS-Protection = "0"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), geolocation=(), microphone=()"
